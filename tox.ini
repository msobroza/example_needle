[tox]
envlist = py310, py311, py312, lint
isolated_build = True

[testenv]
description = Run the test suite
extras = dev
commands =
    pytest {posargs}

[testenv:lint]
description = Run ruff + black in check mode
skip_install = true
deps =
    ruff>=0.4
    black>=24.0
commands =
    ruff check src tests examples scripts
    black --check src tests examples scripts

[testenv:typecheck]
description = Run mypy
extras = dev
commands =
    mypy src
