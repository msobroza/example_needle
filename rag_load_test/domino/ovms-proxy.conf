# nginx in front of OVMS inside a Domino app (RAG_OVMS_PREFIX_PROXY=1).
#
# app.sh renders this file to /tmp/ovms-proxy.conf, replacing __PREFIX__ with
# DOMINO_RUN_HOST_PATH (the __PREFIX__ line is dropped when there is no prefix),
# then runs `nginx -c /tmp/ovms-proxy.conf -g 'daemon off;'`. Every path is
# under /tmp so nginx runs as Domino's ubuntu user. OVMS itself listens on
# 127.0.0.1:9000 (app.sh passes --rest_port 9000); nginx owns 0.0.0.0:8888.
pid /tmp/ovms-proxy.pid;
lock_file /tmp/ovms-proxy.lock;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 1024; }
http {
  access_log off;  # keep logging out of the measurement path
  client_body_temp_path /tmp/ovms-proxy-body;
  proxy_temp_path /tmp/ovms-proxy-tmp;
  fastcgi_temp_path /tmp/ovms-proxy-fcgi;
  uwsgi_temp_path /tmp/ovms-proxy-uwsgi;
  scgi_temp_path /tmp/ovms-proxy-scgi;
  client_max_body_size 16m;  # embedding batches
  upstream ovms { server 127.0.0.1:9000; keepalive 32; }
  server {
    listen 0.0.0.0:8888;
    proxy_http_version 1.1;
    proxy_set_header Connection "";  # reuse upstream connections
    proxy_read_timeout 300s;  # reranking a large batch under load
    # The trailing "/" in proxy_pass drops the matched prefix: /apps/<id>/v3/rerank -> /v3/rerank
    location __PREFIX__/ { proxy_pass http://ovms/; }
    location / { proxy_pass http://ovms; }
  }
}
