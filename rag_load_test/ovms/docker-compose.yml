# Local OpenVINO Model Server pair for the split topologies.
# Run from rag_load_test/:  docker compose -f ovms/docker-compose.yml --env-file ovms/versions.env up -d
# The model repository comes from ovms/export_models.sh (mounted read-only).
services:
  reranker:
    image: ${OVMS_IMAGE}
    container_name: rag-ovms-reranker
    ports:
      - "8001:8001"
    volumes:
      - ./models:/workspace:ro
    # The OVMS image's entrypoint is the ovms binary; these are its arguments.
    command:
      - --rest_port
      - "8001"
      - --config_path
      - /workspace/config_reranker.json
    restart: unless-stopped

  embedder:
    image: ${OVMS_IMAGE}
    container_name: rag-ovms-embedder
    ports:
      - "8002:8002"
    volumes:
      - ./models:/workspace:ro
    command:
      - --rest_port
      - "8002"
      - --config_path
      - /workspace/config_embedder.json
    restart: unless-stopped
