[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-load-test"
version = "0.1.0"
description = "Locust load test comparing one RAG workflow (sentence-transformers + Elasticsearch + reranker + OpenAI + LangGraph + FastAPI) across monolith and OpenVINO Model Server split topologies on Domino."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-elasticsearch>=1.0",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Driving the load test (locust monkey-patches gevent at import; keep it optional).
loadtest = ["locust>=2.29"]
# Domino 6.2 agent tracing (`domino.agents.tracing.add_tracing`).
domino = ["dominodatalab[agents]>=2.2.0"]
dev = [
    "locust>=2.29",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
]

[project.scripts]
rag-serve = "rag_load_test.api:main"
rag-ingest = "rag_load_test.corpus:main"
rag-compare = "rag_load_test.loadtest:compare_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rag_load_test" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/rag_load_test/corpus.py" = ["E501"]  # prose templates

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
mypy_path = "src"
