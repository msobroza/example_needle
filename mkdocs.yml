site_name: example_needle
site_description: Page-level multimodal document retrieval.
repo_url: https://github.com/msobroza/example_needle
repo_name: msobroza/example_needle

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Domain model: domain-model.md
  - Retrievers: retrievers.md
  - Pipeline: pipeline.md
  - Indexing: indexing.md
  - Filters: filters.md
  - Extractors: extractors.md
  - Metrics: metrics.md
  - Configuration: configuration.md
  - CLI: cli.md
  - Contributing a retriever: contributing-a-retriever.md
